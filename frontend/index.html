<!doctype html>
<html lang="mg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <title>Kahie — cahier vocal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <!-- Namerina ny logo kely raha misy -->
      <img src="img/logo-k.png" alt="K" class="logo-k" onerror="this.style.display='none'">
      Kahie <span class="tag">cahier vocal</span>
    </div>
    <div id="net" class="net" title="Réseau">●</div>
  </header>

  <main>
    <!-- 1. Record -->
    <section id="screen-record" class="screen active" aria-label="Raketo">
      <p class="hint">Tsindrio ny bokotra dia mitenena: malagasy, frantsay na samy hafa.</p>

      <div class="mic-wrapper">
        <button id="mic" class="mic" aria-label="Raketo feo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
      </div>

      <div id="rec-state" class="rec-state">Vonona</div>

      <!-- Ireo chips/suggestions ireo (raha tianao ampiasaina) -->
      <div class="chips" id="chips">
        <button class="chip">Iza no manana trosa?</button>
        <button class="chip">Varotra androany</button>
        <button class="chip">Inona no ho lany?</button>
      </div>

      <details class="typed">
        <summary>Soraty fa tsy lazaina</summary>
        <form id="typed-form">
          <input id="typed" placeholder="Rabe naka 3 kapoaka vary, nandoa 2000 Ar" autocomplete="off">
          <button type="submit">Alefa</button>
        </form>
      </details>

      <label class="photo-btn">
        <input id="photo" type="file" accept="image/*" capture="environment" hidden>
        🖼️ Sary ny kahie (import des dettes)
      </label>

      <div id="queue" class="queue" hidden></div>
    </section>

    <!-- 2. Confirmation card -->
    <section id="screen-confirm" class="screen" aria-label="Fanamafisana">
      <div class="ears">
        <div><span class="ear-label">Sofina 1 · Voice Transcribe</span><p id="ear1"></p></div>
        <div><span class="ear-label">Sofina 2 · Spark</span><p id="ear2"></p></div>
      </div>
      <div id="card" class="card"></div>
      <div class="actions">
        <button id="btn-fix" class="ghost">Ovaina</button>
        <button id="btn-ok" class="primary">✓ Marina</button>
      </div>
    </section>

    <!-- 3. Dashboard -->
    <section id="screen-dash" class="screen" aria-label="Tabilao">
      <div id="alerts" class="alerts" hidden></div>
      <div class="kpis">
        <div class="kpi"><span>Varotra androany</span><b id="k-sales">–</b></div>
        <div class="kpi"><span>Trosa rehetra</span><b id="k-debt">–</b></div>
      </div>
      <h3>Trosa</h3><ul id="debts" class="list"></ul>
      <h3>Tahiry ambany</h3><ul id="low" class="list"></ul>
      <h3>Diary</h3><ul id="journal" class="list journal"></ul>
    </section>

    <!-- 4. Statement -->
    <section id="screen-statement" class="screen" aria-label="Tatitra">
      <div class="statement" id="statement"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-screen="record" class="on"><span class="ico">🎙️</span><span>Raketo</span></button>
    <button data-screen="dash"><span class="ico">📒</span><span>Tabilao</span></button>
    <button data-screen="statement"><span class="ico">🧾</span><span>Tatitra</span></button>
  </nav>

  <button id="install" class="install" hidden>📲 Installa an'i Kahie</button>

  <div id="toast" class="toast" hidden></div>

  <!-- DEBUG BOX (Afeno, mipoitra raha misy olana) -->
  <div id="debug-box" style="display:none; position:fixed; bottom:70px; left:10px; right:10px; max-height:80px; overflow-y:auto; background:rgba(255,255,255,0.95); font-family:monospace; font-size:10px; padding:6px; border-radius:6px; z-index:9999; pointer-events:none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>

  <script src="app.js"></script>
</body>
</html>
